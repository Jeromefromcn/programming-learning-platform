services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    environment:
      TZ: Asia/Hong_Kong
    ports:
      - "8080:80"
    depends_on:
      - api-server
    networks:
      - exercise-platform-net
    restart: unless-stopped

  api-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Hong_Kong
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - exercise-platform-net
    restart: unless-stopped

  sandbox:
    build:
      context: ./sandbox
    environment:
      TZ: Asia/Hong_Kong
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - SETUID
      - SETGID
      - SETPCAP
    tmpfs:
      - /tmp:size=256m
    networks:
      - exercise-platform-net
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      TZ: Asia/Hong_Kong
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - exercise-platform-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    environment:
      TZ: Asia/Hong_Kong
      PROMETHEUS_BASIC_AUTH_USER: ${PROMETHEUS_BASIC_AUTH_USER}
      PROMETHEUS_BASIC_AUTH_HASH: ${PROMETHEUS_BASIC_AUTH_HASH}
    entrypoint: ["/prometheus-entrypoint.sh"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/web.yml.tmpl:/etc/prometheus/web.yml.tmpl:ro
      - ./monitoring/prometheus/prometheus-entrypoint.sh:/prometheus-entrypoint.sh:ro
      - prometheus-data:/prometheus
    networks:
      - exercise-platform-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3001:3000"
    environment:
      TZ: Asia/Hong_Kong
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      PROMETHEUS_BASIC_AUTH_USER: ${PROMETHEUS_BASIC_AUTH_USER}
      PROMETHEUS_BASIC_AUTH_PASSWORD: ${PROMETHEUS_BASIC_AUTH_PASSWORD}
    entrypoint: ["/grafana-entrypoint.sh"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/grafana-entrypoint.sh:/grafana-entrypoint.sh:ro
    depends_on:
      - prometheus
    networks:
      - exercise-platform-net
    restart: unless-stopped

  backup:
    build:
      context: ./backup
    environment:
      TZ: Asia/Hong_Kong
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - ${BACKUP_DIR:-/var/backups/exercise-platform}:/backups
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - exercise-platform-net
    restart: unless-stopped

volumes:
  mysql-data:
  prometheus-data:
  grafana-data:

networks:
  exercise-platform-net:
    driver: bridge
